<template id="fig-detect"><div class="rf"><h3>台阶检测：6 种方法</h3><p>41 次放电全部定位到台阶。4 芯极差中位数 0.63 Ah。各方法之间主要差一个常数（中位 0.74 Ah），差分时抵消。</p><table class="rf-l"><thead><tr><th>方法</th><th>定义</th><th>V1 MAE pp</th><th>V2 MAE pp</th></tr></thead><tbody><tr><td>main（主方法）</td><td>约 10 A 段内，上平台（15–25 Ah）与下平台（42–50 Ah）中位电压的中点首次穿越</td><td>0.291</td><td>0.216</td></tr><tr><td>band_narrow</td><td>更窄的电流带</td><td>0.278</td><td>0.217</td></tr><tr><td>windows −3</td><td>两个平台窗口前移 3 Ah</td><td>0.373</td><td>0.274</td></tr><tr><td>windows +3</td><td>两个平台窗口后移 3 Ah</td><td>0.412</td><td>0.304</td></tr><tr><td>dvdq_peak</td><td>dV/dQ 峰（0.25 Ah 网格，噪声约为其他方法的 4 倍）</td><td>0.404</td><td>0.333</td></tr><tr><td>ir_corrected</td><td>内阻校正后的电压</td><td>0.321</td><td>0.238</td></tr></tbody></table><p>提交版：每只电芯取 6 种方法的中位数，每次放电取 4 只电芯的中位数。用任意 5 种方法重建，仍优于上一版。</p><p class="note">MAE 为 ε0 + 0.4 下的代理误差。来源：V1 报告 §1、§3；V2 报告 §4；REPORT.md §1、§3。</p></div></template>
